<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="/schedule/favicon-light.ico"
      sizes="32x32"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/schedule/favicon-dark.ico"
      sizes="32x32"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/schedule/apple-touch-icon.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>КубГАУ Расписание</title>
    <meta
      name="keywords"
      content="Кубанский государственный аграрный университет, КубГАУ, расписание, расписание занятий"
    />
    <meta
      name="description"
      content="Неофициальное расписание занятий Кубанского государственного аграрного университета (КубГАУ)"
    />

    <meta name="color-scheme" content="light dark" />

    <meta name="theme-color" content="#000000" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme") || "system";
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
          var isLight =
            saved === "light" ||
            (saved === "system" &&
              window.matchMedia("(prefers-color-scheme: light)").matches);

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = isLight ? "#f2f2f7" : "#000000";

          window.addEventListener("DOMContentLoaded", function () {
            var link = document.querySelector('link[rel="manifest"]');
            if (link && !isLight) {
              link.href = link.href.replace(
                "manifest.webmanifest",
                "manifest-dark.webmanifest",
              );
            }
          });
        } catch (e) {}
      })();
    </script>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Расписание" />
